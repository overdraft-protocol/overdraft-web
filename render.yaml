services:
  - type: web
    name: overdraft-wallet-site
    runtime: static
    repo: https://github.com/overdraft-protocol/overdraft-web
    branch: prod
    buildCommand: npm ci && npm run build:wallet
    staticPublishPath: dist/wallet
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_WALLET_URL
        value: https://wallet.overdraft.xyz
      - key: VITE_MARKET_URL
        value: https://market.overdraft.xyz
      - key: VITE_ECONOMY_URL
        value: https://economy.overdraft.xyz
      - key: VITE_PAYMENTS_URL
        value: https://payments.overdraft.xyz

