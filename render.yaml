# Note: there is intentionally no workspaces static site here. Like
# market.overdraft.xyz, workspaces.overdraft.xyz is served by its own server
# (overdraft-protocol/workspaces-mvp, on a DigitalOcean droplet — it needs
# Docker + gVisor for sandboxes), which builds this repo's workspaces page
# from a submodule and serves it alongside its /mcp endpoint.
